name: ventilyator
x-backend: &backend
  image: ventilyator-backend:0.1.0
  build:
    context: .
    dockerfile: infrastructure/docker/Dockerfile
    target: backend
  user: "1000:1000"
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  environment: &runtime
    NODE_ENV: ${NODE_ENV:-production}
    APP_ORIGIN: ${APP_ORIGIN:?Run configure.py}
    DATABASE_URL: ${DATABASE_URL:?Run configure.py}
    REDIS_URL: ${REDIS_URL:?Run configure.py}
    STORAGE_ROOT: /app/storage
    NO_PROXY: localhost,127.0.0.1,ventilyator-api,ventilyator-web,ventilyator-postgres,ventilyator-redis
    no_proxy: localhost,127.0.0.1,ventilyator-api,ventilyator-web,ventilyator-postgres,ventilyator-redis
    SESSION_MAX_DAYS: ${SESSION_MAX_DAYS:-30}
    MAIL_CA_FILE: ${MAIL_CA_FILE:-}
    ANTIVIRUS_REQUIRED: ${ANTIVIRUS_REQUIRED:-false}
    CLAMAV_HOST: ${CLAMAV_HOST:-}
    CLAMAV_PORT: ${CLAMAV_PORT:-3310}
  networks: [backend]
  logging: &logging
    driver: json-file
    options: { max-size: 10m, max-file: "3" }
services:
  ventilyator-postgres:
    image: postgres:18.1-alpine@sha256:aa6eb304ddb6dd26df23d05db4e5cb05af8951cda3e0dc57731b771e0ef4ab29
    restart: unless-stopped
    environment:
      POSTGRES_USER: ventilyator
      POSTGRES_DB: ventilyator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run configure.py}
    volumes: ["${DATA_ROOT:-/srv/ventilyator}/postgres:/var/lib/postgresql"]
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ventilyator -d ventilyator"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging
  ventilyator-redis:
    image: redis:8.4.0-alpine@sha256:4eec4565e45aa0b3966554c866bc73211e281b0b3d89fe9a33c982e6faca809d
    user: "999:999"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Run configure.py}
    command: [sh, -c, 'exec redis-server --appendonly yes --appendfsync everysec --requirepass "$$REDISCLI_AUTH" --maxmemory 256mb --maxmemory-policy noeviction']
    volumes: ["${DATA_ROOT:-/srv/ventilyator}/redis:/data"]
    networks: [backend]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging
  ventilyator-migrate:
    <<: *backend
    restart: "no"
    command: [node, packages/database/node_modules/prisma/build/index.js, migrate, deploy, --config, packages/database/prisma.config.ts]
    depends_on:
      ventilyator-postgres: { condition: service_healthy }
  ventilyator-api:
    <<: *backend
    environment:
      <<: *runtime
      IMAP_HOST: ${IMAP_HOST:-}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_DOMAIN: ${IMAP_DOMAIN:-}
      IMAP_ORGANIZATION_ID: ${IMAP_ORGANIZATION_ID:-}
    volumes: ["${DATA_ROOT:-/srv/ventilyator}/storage:/app/storage"]
    depends_on:
      ventilyator-migrate: { condition: service_completed_successfully }
      ventilyator-redis: { condition: service_healthy }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 6s
      retries: 10
      start_period: 20s
    networks: [backend, frontend]
  ventilyator-worker:
    <<: *backend
    command: [node, apps/worker/dist/main.js]
    volumes: ["${DATA_ROOT:-/srv/ventilyator}/storage:/app/storage"]
    networks: [backend, frontend]
    depends_on:
      ventilyator-migrate: { condition: service_completed_successfully }
      ventilyator-redis: { condition: service_healthy }
    healthcheck:
      test: [CMD, node, -e, "const Redis=require('./apps/worker/node_modules/ioredis');const r=new Redis(process.env.REDIS_URL);r.get('ventilyator:worker:heartbeat').then(v=>{r.disconnect();process.exit(v?0:1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
  ventilyator-web:
    image: ventilyator-web:0.1.0
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: web
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      NO_PROXY: localhost,127.0.0.1,ventilyator-api,ventilyator-web
      no_proxy: localhost,127.0.0.1,ventilyator-api,ventilyator-web
    networks: [frontend]
    healthcheck:
      test: [CMD, wget, -Y, "off", -q, --spider, "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 6
    logging: *logging
  ventilyator-proxy:
    image: ventilyator-proxy:0.1.0
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: proxy
    user: "1000:1000"
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      APP_HOST: ${APP_HOST:?Run configure.py}
      TLS_CERT: ${TLS_CERT:-internal}
      TLS_KEY: ${TLS_KEY:-}
      XDG_DATA_HOME: /data
      XDG_CONFIG_HOME: /tmp/caddy-config
      NO_PROXY: localhost,127.0.0.1,ventilyator-api,ventilyator-web
      no_proxy: localhost,127.0.0.1,ventilyator-api,ventilyator-web
    ports:
      - "${HTTP_PORT:-80}:8080"
      - "${HTTPS_PORT:-443}:8443"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DATA_ROOT:-/srv/ventilyator}/config/caddy:/data
      - ${DATA_ROOT:-/srv/ventilyator}/config/tls:/etc/ventilyator/tls:ro
    networks: [frontend]
    depends_on:
      ventilyator-api: { condition: service_healthy }
      ventilyator-web: { condition: service_healthy }
    logging: *logging
networks:
  backend:
    internal: true
  frontend: {}
